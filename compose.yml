services:
###> symfony/mercure-bundle ###
  mercure:
    image: dunglas/mercure
    restart: unless-stopped
    environment:
      SERVER_NAME: ':80'
      MERCURE_PUBLISHER_JWT_KEY: '!ChangeMe!+MAKE_THE_KEY_LONG_ENOUGH'
      MERCURE_SUBSCRIBER_JWT_KEY: '!ChangeMe!+MAKE_THE_KEY_LONG_ENOUGH'
      # Set the URL of your Symfony project (without trailing slash!) as value of the cors_origins directive
      MERCURE_EXTRA_DIRECTIVES: |
        cors_origins https://127.0.0.1:9044
    volumes:
      - mercure_data:/data
      - mercure_config:/config
###< symfony/mercure-bundle ###

###> symfony/ux-ipx-image ###
  ipx:
    image: node:26-alpine
    command: npx --yes ipx@4 serve
    environment:
      IPX_FS_DIR: /srv/public
      # autoorient and extract: the Upload, Crop & Serve demo
      IPX_ALLOWED_MODIFIERS: width,height,resize,fit,format,quality,autoorient,extract
    volumes:
      - ./public:/srv/public:ro
###< symfony/ux-ipx-image ###

volumes:
###> symfony/mercure-bundle ###
  mercure_data:
  mercure_config:
###< symfony/mercure-bundle ###
