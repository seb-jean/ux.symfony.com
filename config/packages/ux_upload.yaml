ux_upload:
    storage: local
    temp_dir: '%app.upload_demo_dir%/tmp'
    local_storage:
        directory: '%app.upload_demo_dir%'
    completed_ttl: 300
    max_pending_per_owner: 10
    rate_limiter: limiter.upload_demo

    uploaders:
        documents:
            max_size: 1M
            allowed_types: ['application/pdf']
        gallery:
            max_size: 1M
            allowed_types: ['image/png', 'image/jpeg', 'image/webp']
        avatars:
            max_size: 1M
            allowed_types: ['image/png', 'image/jpeg', 'image/webp']
        large:
            max_size: 1M
            allowed_types: ['application/zip']
            chunk_size: 64K
            parallel_chunks: 2
        # Upload, Crop & Serve: a photo, kept 10 minutes for IPX (App\Service\CropDemoPhotos)
        photos:
            max_size: 5M
            allowed_types: ['image/jpeg', 'image/png', 'image/webp']
            # PHP refuses a file above 1 MB (php.ini): a larger photo travels in 1 MB chunks
            chunk_size: 1M
